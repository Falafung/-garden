<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#05080f}
body{font-family:'Noto Sans Thai','DejaVu Sans',sans-serif;color:#fff}
#stage{transform-origin:0 0;position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;background:linear-gradient(160deg,#0d1730 0%,#0b1220 55%,#0a1a1a 100%)}
.blob{position:absolute;border-radius:50%;filter:blur(110px);opacity:.35}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:60px 60px}
.scene{position:absolute;inset:0}
.abs{position:absolute}
/* info panel */
.info{position:absolute;left:100px;top:165px;width:770px}
.badge{width:112px;height:112px;border-radius:32px;background:linear-gradient(135deg,#FFCA28,#F57C00);font-weight:800;font-size:70px;color:#1b1200;display:flex;align-items:center;justify-content:center;margin-bottom:26px;box-shadow:0 14px 40px rgba(245,124,0,.35)}
.ttl{font-size:58px;font-weight:800;line-height:1.35}
.sub{font-size:28px;color:#9fb0cc;line-height:1.5;margin-top:4px;margin-bottom:26px}
.bul{display:flex;gap:16px;align-items:flex-start;font-size:29px;line-height:1.5;color:#e8eefc;margin-bottom:18px}
.bul .ck{flex:none;width:36px;height:36px;border-radius:50%;background:#22c55e;margin-top:6px;display:flex;align-items:center;justify-content:center}
.bul b{color:#FFCA28;font-weight:700}
/* stepper */
.stepper{position:absolute;left:0;top:46px;width:1920px;height:80px}
.st{position:absolute;top:0;width:200px;text-align:center}
.st .c{position:relative;width:38px;height:38px;margin:0 auto;border-radius:50%;border:3px solid #3a4a6b;background:#0f1a33}
.st .c i{position:absolute;inset:-3px;border-radius:50%}
.st .l{font-size:19px;color:#8ea0c0;margin-top:8px}
.stline{position:absolute;top:19px;height:3px;background:#2a3857}
/* window */
.win{position:absolute;background:#fff;border-radius:20px;box-shadow:0 40px 110px rgba(0,0,0,.55);overflow:hidden;color:#202124}
.bar{height:56px;background:#eceff5;display:flex;align-items:center;padding:0 20px;gap:10px;border-bottom:1px solid #dfe3ea}
.bar i{width:14px;height:14px;border-radius:50%;display:block}
.url{margin-left:18px;flex:1;height:34px;background:#fff;border-radius:17px;font-size:18px;padding:0 18px;display:flex;align-items:center;color:#444;font-family:'DejaVu Sans',sans-serif}
.body{position:absolute;top:56px;left:0;right:0;bottom:0}
.pnl{position:absolute;inset:0;background:#fff;overflow:hidden}
.hd{height:74px;border-bottom:1px solid #e3e6ec;display:flex;align-items:center;padding:0 28px;font-size:26px;font-weight:700;gap:12px}
.hd .r{margin-left:auto;width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#4285F4,#34A853)}
.ctr{position:absolute;left:0;right:0;display:flex;flex-direction:column;align-items:center;text-align:center}
.btn{display:inline-flex;align-items:center;justify-content:center;height:64px;padding:0 34px;border-radius:14px;background:#FFA000;color:#1b1200;font-size:26px;font-weight:700}
.btn.b{background:#1a73e8;color:#fff}
.inp{height:70px;border:3px solid #1a73e8;border-radius:14px;font-size:30px;padding:0 22px;display:flex;align-items:center;color:#202124;width:100%}
.lbl{font-size:22px;color:#5f6368;margin-bottom:8px}
.h1{font-size:40px;font-weight:700;line-height:1.35}
.p{font-size:24px;color:#5f6368;line-height:1.5}
.tg{position:relative;width:76px;height:42px;border-radius:21px;background:#c5cad3;flex:none}
.tg .on{position:absolute;inset:0;border-radius:21px;background:#1a73e8}
.tg .kn{position:absolute;left:5px;top:5px;width:32px;height:32px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.35)}
.row{display:flex;align-items:center;gap:18px;border:2px solid #e0e4eb;border-radius:14px;padding:0 24px;height:78px;font-size:26px;position:relative;background:#fff}
.row.hl{border-color:#1a73e8}
.pill{display:inline-flex;align-items:center;height:42px;padding:0 18px;border-radius:21px;font-size:22px;font-weight:700}
.code{background:#14192b;color:#e6edf3;font-family:'DejaVu Sans Mono',monospace;font-size:22px;line-height:1.5;white-space:pre;padding:22px 28px;border-radius:16px;overflow:hidden}
.code i{font-style:normal}.code .s{color:#a5e075}.code .k{color:#c792ea}.code .c{color:#6f7fa3}
.cr{display:inline-block;width:3px;height:1.1em;background:currentColor;vertical-align:-0.18em;margin-left:2px}
.cursor{position:absolute;left:0;top:0;width:40px;height:40px;z-index:60;transform-origin:0 0;filter:drop-shadow(0 4px 6px rgba(0,0,0,.45))}
.ripple{position:absolute;left:-44px;top:-44px;width:88px;height:88px;border-radius:50%;border:5px solid #FFCA28;background:rgba(255,202,40,.28);z-index:59}
.side{position:absolute;left:0;top:0;bottom:0;width:220px;background:#f6f8fb;border-right:1px solid #e3e6ec;padding:26px 18px;font-size:22px;color:#444}
.side .it{white-space:nowrap;font-size:20px;height:54px;border-radius:12px;display:flex;align-items:center;padding:0 16px;margin-bottom:6px;position:relative}
.side .it u{position:absolute;inset:0;border-radius:12px;background:#dbe8fd;text-decoration:none}
.side .it span{position:relative}
.card{position:absolute;background:#fff;border-radius:26px;color:#1d2433;box-shadow:0 24px 70px rgba(0,0,0,.4)}
.dev{position:absolute;background:#1b2338;border:8px solid #cfd6e6;box-shadow:0 18px 50px rgba(0,0,0,.5)}
.dev .scr{position:absolute;inset:0;background:#f4f7f2;overflow:hidden;border-radius:inherit}
.dev .top{height:46px;background:#2e7d32;color:#fff;font-size:20px;font-weight:700;display:flex;align-items:center;padding:0 14px}
.gbtn{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);white-space:nowrap;background:#fff;border:2px solid #d0d5dd;border-radius:30px;font-size:18px;font-weight:700;color:#333;padding:10px 16px;display:flex;align-items:center;gap:10px}

.lab{position:absolute;font-size:26px;color:#c9d6f0;text-align:center;width:300px}
